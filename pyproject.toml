[project]
name = "sentinelle"
version = "0.1.0"
description = "IA de trading crypto spot — moteur de validation et gardien des risques"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "pydantic>=2.6", "anthropic>=1.15", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinelle*"]
