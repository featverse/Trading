# SENTINELLE sur le VPS : bot Freqtrade (DRY-RUN) + serveur API/superviseur + HTTPS.
#
# 1. cp deploy/.env.example deploy/.env ; python scripts/hash_password.py ; remplir .env ; chmod 600 deploy/.env
# 2. Stratégie validée : copier research/strategies/<nom>/freqtrade/*.py -> deploy/user_data/strategies/
#    et config.dryrun.json -> deploy/user_data/config.json
# 3. docker compose -f deploy/docker-compose.yml up -d --build
#
# À VÉRIFIER : épingler les images sur des versions datées après test.
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: sentinelle-freqtrade
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINELLE_GUARD_URL: http://api:8000/internal/guard/check
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.json
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: sentinelle-api
    restart: unless-stopped
    env_file: .env
    environment:
      SENTINELLE_DB: /data/sentinelle.sqlite
      SENTINELLE_RESEARCH_DIR: /research
      SENTINELLE_FREQTRADE_URL: http://freqtrade:8080
    volumes:
      - api_data:/data
      - ../research:/research:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  caddy:
    image: caddy:2
    container_name: sentinelle-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [internal]

networks:
  internal:

volumes:
  api_data:
  caddy_data:
